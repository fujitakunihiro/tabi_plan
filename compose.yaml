services:
  tabi:
    build: .
    ports:
      - "${PORT:-8080}:3000"
    environment:
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      DB_PATH: /app/data/tabi.sqlite
    volumes:
      - tabi-data:/app/data
    restart: unless-stopped

volumes:
  tabi-data:
